name: Deploy site to GitHub Pages

# Publishes the build that is committed at the repository root.
#
# It does not build here, and that is deliberate. This workflow used to run
# `npm run build` with the Supabase values coming from repository variables --
# and an unset variable substitutes an EMPTY STRING, so it happily produced a
# bundle with no credentials, deployed it, and served a blank white page.
#
# The build now happens locally, where the values are in web/.env.local and
# either work or visibly do not:
#
#     npm --prefix web run publish     # builds and copies to the repo root
#     git commit -am "..." && git push
#
# So what is deployed is exactly what was reviewed, and there is no way for a
# missing setting to publish a broken site over a working one.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - 'assets/**'
      - 'brand/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the published site
        run: |
          if [ ! -f index.html ] || [ ! -d assets ]; then
            echo "::error::No built site at the repository root."
            echo "::error::Run 'npm --prefix web run publish', then commit index.html and assets/."
            exit 1
          fi
          mkdir -p _site
          cp index.html _site/
          cp -f 404.html _site/ 2>/dev/null || cp index.html _site/404.html
          cp -r assets _site/
          # brand/ is the logo and the favicons. It is not under assets/, so
          # leaving it out here serves a site with no icon and no wordmark.
          if [ -d brand ]; then cp -r brand _site/; else
            echo "::error::No brand/ at the repository root — run 'npm --prefix web run publish'."
            exit 1
          fi
          touch _site/.nojekyll
          echo "publishing:"
          find _site -type f | sed 's/^/  /'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
