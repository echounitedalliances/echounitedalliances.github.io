    <script>
      // Until 31 October 2026 every address kept its page after a #
      // (/#/d/aegis). Links to those are all over Discord, and sign-in still
      // returns to /?code=...#/resonance, so turn them into real addresses
      // before the app reads the URL, keeping any query on either side.
      (function () {
        var h = location.hash
        if (h.indexOf('#/') !== 0) return
        var route = h.slice(1), inner = ''
        var i = route.indexOf('?')
        if (i >= 0) { inner = route.slice(i + 1); route = route.slice(0, i) }
        var search = [location.search.slice(1), inner].filter(Boolean).join('&')
        history.replaceState(null, '', route + (search ? '?' + search : ''))
      })()
    </script>
