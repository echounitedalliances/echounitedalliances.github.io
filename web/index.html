<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Echo United Alliances</title>
    <meta name="description" content="Ten divisions. 708 airlines. One network. Browse every carrier, route and departure in Echo United Alliances." />
    <!-- Search results show a square icon at a multiple of 48px. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/echo-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/echo-icon-512.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- Installable: the manifest opens it as an app, without the browser's bars.
         iOS ignores most of the manifest, so it is told the same thing here. -->
    <link rel="manifest" href="/brand/site.webmanifest" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EUA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
